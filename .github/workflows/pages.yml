name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "web/**"
      - "fixtures/protocol/**"
      - "scripts/smoke-browser.py"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "fixtures/protocol/**"
      - "scripts/smoke-browser.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'labeled' || github.event.label.name == 'browser-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test browser contracts
        working-directory: web
        run: bun test
      - name: Build tech demo
        working-directory: web
        run: bun run build
      - name: Install browser acceptance tooling
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-evidence')
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise production browser demo
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-evidence')
        run: python3 scripts/smoke-browser.py
      - name: Retain browser screenshots and evidence
        if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-evidence'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
