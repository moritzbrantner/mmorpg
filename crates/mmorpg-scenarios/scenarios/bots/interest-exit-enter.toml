# Two bots walk apart until player-scoped interest (4500 units) drops them
# from each other's snapshots; alice is stopped by the west wall. They turn
# around at tick 170 and must re-enter each other's snapshots by tick 190.
name = "interest-exit-enter"
zone = 1
ticks = 195
digest_interval = 10

[[bots]]
name = "alice"

[[bots]]
name = "bob"

[[steps]]
tick = 0
bot = "alice"
action = "join"

[[steps]]
tick = 0
bot = "bob"
action = "join"

[[steps]]
tick = 0
bot = "alice"
action = "move"
forward = 1
strafe = 0
facing = 49152

[[steps]]
tick = 0
bot = "bob"
action = "move"
forward = 1
strafe = 0
facing = 16384

[[steps]]
tick = 170
bot = "alice"
action = "move"
forward = 1
strafe = 0
facing = 16384

[[steps]]
tick = 170
bot = "bob"
action = "move"
forward = 1
strafe = 0
facing = 49152

[[expect]]
kind = "not_sees"
bot = "alice"
target = "bob"
tick = 170

[[expect]]
kind = "visible_count"
bot = "bob"
tick = 170
count = 1

[[expect]]
kind = "sees"
bot = "alice"
target = "bob"
from_tick = 171
by_tick = 190

[[expect]]
kind = "sees"
bot = "bob"
target = "alice"
from_tick = 171
by_tick = 190
