[workspace]
members = [
  "crates/mmorpg-core",
  "crates/mmorpg-protocol",
  "crates/mmorpg-game-server",
  "crates/mmorpg-control-plane",
  "crates/mmorpg-client",
  "crates/mmorpg-scenarios",
  "crates/mmorpg-scenery",
  "crates/mmorpg-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "a3851dab9c1fb25dd31b465fb554ca475769caab" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine.git", rev = "1d62f70e3588b80e51746ed7d05bb8bbd0bfbfdb" }
mmorpg-core = { path = "crates/mmorpg-core" }
mmorpg-control-plane = { path = "crates/mmorpg-control-plane" }
mmorpg-protocol = { path = "crates/mmorpg-protocol" }
mmorpg-game-server = { path = "crates/mmorpg-game-server" }
mmorpg-scenery = { path = "crates/mmorpg-scenery" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
